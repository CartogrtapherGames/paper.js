name: Release

# Runs whenever a tag like v0.1.0 is pushed.
on:
  push:
    tags:
      - 'v*'

# Needed so this workflow is allowed to create a GitHub Release.
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      # Produces dist/paper.js (readable), dist/paper.min.js (minified),
      # their sourcemaps, and the .d.ts declarations.
      - name: Build
        run: npm run build

      # A full zip of dist/ for anyone who wants everything (including the
      # per-folder type declarations) in one drop-in download.
      - name: Zip the full dist folder
        run: cd dist && zip -r ../paper.js-dist.zip . && cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/paper.js
            dist/paper.min.js
            dist/paper.js.map
            dist/paper.min.js.map
            dist/index.d.ts
            paper.js-dist.zip
